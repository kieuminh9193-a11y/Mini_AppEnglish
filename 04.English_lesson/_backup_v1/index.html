<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>English Lesson: This Is Me!</title>
    <!-- Kid friendly font -->
    <link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@400;600;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <script src="data.js"></script>
</head>
<body>
    <div id="app-container">
        
        <!-- HOME VIEW (Unit Selection) -->
        <section id="home-view" class="view active">
            <h1 class="bounce-in">English Lessons 🚀</h1>
            <p>Chọn bài học để bắt đầu nhé!</p>
            <div class="unit-list">
                <button class="btn primary" onclick="app.selectUnit('unit1')">Unit 1: This is me</button>
                <button class="btn secondary" disabled>Unit 2: (Sắp ra mắt...)</button>
            </div>
        </section>

        <!-- MENU VIEW (Game Selection) -->
        <section id="menu-view" class="view">
            <button class="btn back-btn" onclick="app.showView('home-view')">⬅️ Chọn bài khác</button>
            <h1 class="bounce-in" id="menu-title">Unit 1: This is me</h1>
            <p>Chọn phần học nha bé!</p>
            <div class="menu-buttons">
                <button class="btn primary btn-bounce" onclick="app.showView('video-view')">
                    <span class="icon">📺</span> Xem Video
                </button>
                <button class="btn secondary btn-bounce" onclick="app.showView('game1-view', 'emoji')">
                    <span class="icon">🎮</span> Lật Hình Giống Nhau
                </button>
                <button class="btn secondary btn-bounce" onclick="app.showView('game1-view', 'word')">
                    <span class="icon">🔠</span> Lật Chữ Giống Nhau
                </button>
                <button class="btn accent btn-bounce" onclick="app.showView('game2-view')">
                    <span class="icon">👂</span> Nghe & Chọn
                </button>
                <button class="btn primary btn-bounce" onclick="app.showView('game3-view')" style="background: linear-gradient(135deg, #a18cd1 0%, #fbc2eb 100%);">
                    <span class="icon">📖</span> Tập Đọc
                </button>
            </div>
        </section>

        <!-- VIDEO VIEW -->
        <section id="video-view" class="view">
            <button class="btn back-btn" onclick="app.showView('menu-view')">⬅️ Quay Lại</button>
            <h2>Học Từ Vựng</h2>
            <div class="video-layout">
                <div class="video-left">
                    <div class="video-container">
                        <video id="lesson-video" controls playsinline webkit-playsinline>
                            <source src="REF/3663094155105559082.mp4" type="video/mp4">
                            Trình duyệt của bạn không hỗ trợ video.
                        </video>
                        <div id="video-caption" class="video-caption">Hãy bấm Play để xem video!</div>
                    </div>
                    <div class="video-controls-wrap">
                        <label for="video-speed">Tốc độ:</label>
                        <select id="video-speed" onchange="app.changeVideoSpeed(this.value)">
                            <option value="0.5">0.5x (Rất chậm)</option>
                            <option value="0.75">0.75x (Chậm)</option>
                            <option value="1" selected>1.0x (Bình thường)</option>
                            <option value="1.25">1.25x (Nhanh)</option>
                            <option value="1.5">1.5x (Rất nhanh)</option>
                        </select>
                    </div>
                </div>
                <div class="transcript-container" id="interactive-transcript">
                    <!-- Transcript generated by JS -->
                </div>
            </div>
        </section>

        <!-- GAME 1: MEMORY -->
        <section id="game1-view" class="view">
            <button class="btn back-btn" onclick="app.showView('menu-view')">⬅️ Quay Lại</button>
            <h2 id="memory-title">Lật Hình Giống Nhau</h2>
            <div class="score-board">Điểm: <span id="memory-score">0</span></div>
            <div id="memory-board" class="memory-board">
                <!-- Cards will be generated here -->
            </div>
            <button id="restart-memory-btn" class="btn primary hidden" onclick="app.startMemoryGame(app.currentMemoryMode)">Chơi Lại!</button>
        </section>

        <!-- GAME 2: LISTEN & CHOOSE -->
        <section id="game2-view" class="view">
            <button class="btn back-btn" onclick="app.showView('menu-view')">⬅️ Quay Lại</button>
            <h2>Nghe & Chọn Đúng</h2>
            <div class="score-board">Câu đúng: <span id="listen-score">0</span> / 6</div>
            
            <div class="listen-container">
                <button id="play-sound-btn" class="btn huge btn-bounce" onclick="app.playCurrentWord()">
                    🔊 Nghe
                </button>
                <p class="hint">Click loa để nghe và chọn từ bên dưới</p>
                <div id="options-board" class="options-board">
                    <!-- Options will be generated here -->
                </div>
                <button id="confirm-listen-btn" class="btn primary hidden" onclick="app.confirmListenAnswer()" style="margin-top: 15px;">Xác nhận</button>
            </div>
            <button id="restart-listen-btn" class="btn primary hidden" onclick="app.startListenGame()">Chơi Lại!</button>
        </section>

        <!-- GAME 3: READ ALONG -->
        <section id="game3-view" class="view">
            <button class="btn back-btn" onclick="app.showView('menu-view')">⬅️ Quay Lại</button>
            <h2>Cùng Tập Đọc Nhé!</h2>
            
            <div class="read-along-container">
                <div class="speed-controls">
                    <label><input type="radio" name="speed" value="0.5"> 🐢 Chậm</label>
                    <label><input type="radio" name="speed" value="0.8" checked> 🚶 Thường</label>
                    <label><input type="radio" name="speed" value="1.2"> 🐇 Nhanh</label>
                </div>
                
                <div id="read-card" class="read-card">
                    <!-- Text and image will be injected here -->
                </div>
                <div class="read-controls">
                    <button class="btn secondary" onclick="app.prevReadSentence()">⬅️ Câu Trước</button>
                    <button class="btn accent huge-read-btn btn-bounce" onclick="app.playReadSentence()">🔊 Nghe</button>
                    <button class="btn secondary" onclick="app.nextReadSentence()">Câu Tiếp ➡️</button>
                </div>
                <p class="read-progress" id="read-progress">1 / 5</p>
            </div>
        </section>

    </div>

    <!-- Confetti Library -->
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <script src="script.js"></script>
</body>
</html>
